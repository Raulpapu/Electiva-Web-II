<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Encuentra las Parejas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🧠 Memory Match</h1>
        <p>Encuentra todas las parejas de imágenes</p>
    </header>
    
    <main class="game">
        <div class="game-info">
            <div class="stats">
                <p id="moves">Movimientos: <span>0</span></p>
                <p id="pairs">Parejas: <span>0/8</span></p>
                <p id="timer">Tiempo: <span>00:00</span></p>
            </div>
            
            <div class="controls">
                <button id="startBtn">Comenzar Juego</button>
                <button id="resetBtn" class="hidden">Reiniciar</button>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- Las cartas se generarán aquí -->
        </div>
        
        <div id="message"></div>
    </main>
    
    <footer>
        <p>¡Ejercita tu memoria!</p>
    </footer>
    
    <script src="scrip.js"></script>
</body>
</html>
